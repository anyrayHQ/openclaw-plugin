name: Publish

# Publishing is deliberately manual and tag-driven: an npm version cannot be
# unpublished after 72 hours, so it must never ride an ordinary push to main.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what links the published
      # tarball to this repository and workflow, giving the package its
      # "Provenance" attestation on npmjs.com.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --no-audit --no-fund

      # Never publish a tarball whose tests did not pass.
      - run: npm test

      # The tag must match the version being published, or a release that says
      # v0.1.1 can quietly ship 0.1.0.
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package version $PKG" >&2
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
